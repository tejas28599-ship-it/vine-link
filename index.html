<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Vine Link</title>
  <meta name="description" content="Connect matching colored dots with pipes. Pipes can't cross, and every cell must be filled.">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Vine Link">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="format-detection" content="telephone=no">
  <meta name="msapplication-tap-highlight" content="no">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H6M11 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-next" viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 7H5V3M5.4 7.1A8 8 0 1 1 4.3 15" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-restart" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 8.5A7.5 7.5 0 0 0 5.2 9"/><path d="M19 4v4.5h-4.5"/><path d="M5 15.5A7.5 7.5 0 0 0 18.8 15"/><path d="M5 20v-4.5h4.5"/></g></symbol>
      <symbol id="i-hint" viewBox="0 0 24 24"><path d="M8.6 9a3.5 3.5 0 1 1 5.1 3.1c-1 .5-1.7 1.3-1.7 2.4v.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><circle cx="12" cy="19" r="1.6" fill="currentColor"/></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="3.6" stroke-dasharray="3.2 3.08"/><circle cx="12" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="12" cy="12" r="2.2" fill="currentColor"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2.5" fill="currentColor"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2.2"/></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z" fill="currentColor"/></symbol>
      <symbol id="i-grid" viewBox="0 0 24 24"><g fill="currentColor"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></g></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></g><circle cx="12" cy="15" r="2" fill="currentColor"/></symbol>
    </defs>
  </svg>

  <div id="app">
    <!-- Home -------------------------------------------------------------------------------->
    <section id="screen-home" class="screen active" aria-label="Home">
      <button class="round-btn corner" id="btn-settings" aria-label="Settings"><svg><use href="#i-gear"/></svg></button>
      <div class="home-hero">
        <svg class="hero-art" viewBox="0 0 200 120" aria-hidden="true">
          <g stroke="#77722F" stroke-width="1">
            <path d="M0 .5h200M0 40h200M0 80h200M0 119.5h200M.5 0v120M40 0v120M80 0v120M120 0v120M160 0v120M199.5 0v120"/>
          </g>
          <rect x="1" y="1" width="39" height="39" fill="#FF0000" opacity=".3"/><rect x="40" y="1" width="40" height="39" fill="#FF0000" opacity=".3"/><rect x="80" y="1" width="40" height="39" fill="#FF0000" opacity=".3"/><rect x="80" y="40" width="40" height="40" fill="#FF0000" opacity=".3"/>
          <path d="M20 20H100V60" fill="none" stroke="#FF0000" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="20" cy="20" r="14" fill="#FF0000"/><circle cx="100" cy="60" r="14" fill="#FF0000"/>
          <rect x="1" y="80" width="39" height="39" fill="#0000FF" opacity=".35"/><rect x="40" y="80" width="40" height="39" fill="#0000FF" opacity=".35"/><rect x="1" y="40" width="39" height="40" fill="#0000FF" opacity=".35"/>
          <path d="M20 60V100H60" fill="none" stroke="#0000FF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="20" cy="60" r="14" fill="#0000FF"/><circle cx="60" cy="100" r="14" fill="#0000FF"/>
          <rect x="120" y="1" width="40" height="39" fill="#EEEE00" opacity=".3"/><rect x="160" y="1" width="39" height="39" fill="#EEEE00" opacity=".3"/><rect x="160" y="40" width="39" height="40" fill="#EEEE00" opacity=".3"/>
          <path d="M140 20H180V60" fill="none" stroke="#EEEE00" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="140" cy="20" r="14" fill="#EEEE00"/><circle cx="180" cy="60" r="14" fill="#EEEE00"/>
          <circle cx="140" cy="100" r="14" fill="#FF8000"/><circle cx="180" cy="100" r="14" fill="#FF8000"/>
          <circle cx="60" cy="60" r="14" fill="#008D00"/><circle cx="140" cy="60" r="14" fill="#008D00"/>
        </svg>
        <h1 class="title" aria-label="Vine Link"><span>V</span><span>i</span><span>n</span><span>e</span> <span>L</span><span>i</span><span>n</span><span>k</span></h1>
        <p class="tagline">Connect matching colors. Fill every cell.</p>
      </div>
      <div class="home-actions">
        <button class="btn primary big" id="btn-play">
          <span class="btn-label">Play</span>
          <span class="btn-sub" id="home-level">Level 1 · Starter</span>
        </button>
        <div class="row">
          <button class="btn" id="btn-levels"><svg><use href="#i-grid"/></svg>Levels</button>
          <button class="btn" id="btn-daily"><svg><use href="#i-calendar"/></svg>Daily Puzzle<span class="dot" id="daily-dot" hidden></span></button>
        </div>
        <p class="home-progress" id="home-progress"></p>
      </div>
    </section>

    <!-- Level select ------------------------------------------------------------------------>
    <section id="screen-levels" class="screen" aria-label="Choose a level">
      <header class="bar">
        <button class="round-btn" data-nav="home" aria-label="Back"><svg><use href="#i-back"/></svg></button>
        <h2>Levels</h2>
        <span class="bar-spacer"></span>
      </header>
      <nav class="pack-tabs" id="pack-tabs" role="tablist"></nav>
      <p class="pack-blurb" id="pack-blurb"></p>
      <div class="level-grid scroll" id="level-grid"></div>
    </section>

    <!-- Game -------------------------------------------------------------------------------->
    <section id="screen-game" class="screen" aria-label="Puzzle">
      <header class="bar topbar">
        <button class="round-btn" id="btn-back" aria-label="Back to menu"><svg><use href="#i-back"/></svg></button>
        <h2 class="level-title"><span id="level-title">Level 1</span> <span class="level-size" id="level-size">5×5</span></h2>
        <button class="round-btn small" id="btn-settings-game" aria-label="Settings"><svg><use href="#i-gear"/></svg></button>
      </header>
      <div class="info" aria-live="polite">
        <span>pairs: <b id="pairs">0/0</b></span>
        <span>moves: <b id="moves">0</b></span>
        <span>best: <b id="best">–</b></span>
        <span>filled: <b id="filled">0%</b></span>
      </div>
      <main class="board-wrap" id="board-wrap">
        <canvas id="board" aria-label="Puzzle grid" role="img"></canvas>
        <div class="loading" id="loading" hidden><span class="spinner"></span>Building today's puzzle…</div>
      </main>
      <footer class="toolbar">
        <button class="round-btn" id="btn-undo" aria-label="Undo"><svg><use href="#i-undo"/></svg></button>
        <button class="round-btn" id="btn-prev" aria-label="Previous level"><svg><use href="#i-back"/></svg></button>
        <button class="round-btn" id="btn-restart" aria-label="Restart"><svg><use href="#i-restart"/></svg></button>
        <button class="round-btn" id="btn-next-level" aria-label="Next level"><svg><use href="#i-next"/></svg></button>
        <button class="hint-btn" id="btn-hint" aria-label="Hint"><span id="hint-count">3</span> ×<span class="round-btn" aria-hidden="true"><svg><use href="#i-hint"/></svg></span></button>
      </footer>
    </section>
  </div>

  <canvas id="magnifier" aria-hidden="true"></canvas>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Win overlay ----------------------------------------------------------------------------->
  <div class="overlay" id="overlay-win" hidden>
    <div class="card win-card" role="dialog" aria-labelledby="win-title">
      <h2 id="win-title">Level Complete!</h2>
      <p class="win-detail" id="win-detail">Solved in 6 moves</p>
      <div class="perfect" id="win-perfect" hidden><svg><use href="#i-star"/></svg>Perfect: every pair drawn once</div>
      <div class="win-actions">
        <button class="btn" id="btn-win-menu">Menu</button>
        <button class="btn primary" id="btn-next"><span class="btn-label" id="next-label">Next level</span><span class="auto-ring" id="auto-ring"></span></button>
      </div>
    </div>
  </div>

  <!-- Settings -------------------------------------------------------------------------------->
  <div class="overlay" id="overlay-settings" hidden>
    <div class="card" role="dialog" aria-labelledby="settings-title">
      <h2 id="settings-title">Settings</h2>
      <label class="toggle"><span>Sound</span><input type="checkbox" id="set-sound"><i></i></label>
      <label class="toggle"><span>Vibration</span><input type="checkbox" id="set-vibration"><i></i></label>
      <label class="toggle"><span>Colorblind mode<small>A symbol on every dot</small></span><input type="checkbox" id="set-colorblind"><i></i></label>
      <button class="btn ghost danger" id="btn-reset">Reset progress</button>
      <button class="btn primary" data-close>Done</button>
      <p class="fineprint">Vine Link · made with vanilla JS · works offline</p>
    </div>
  </div>

  <!-- Tutorial -------------------------------------------------------------------------------->
  <div class="overlay" id="overlay-tutorial" hidden>
    <div class="card tutorial-card" role="dialog" aria-labelledby="tut-title">
      <div class="tut-art" id="tut-art"></div>
      <h2 id="tut-title">Connect the dots</h2>
      <p id="tut-text"></p>
      <button class="btn primary" data-close>Got it</button>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
